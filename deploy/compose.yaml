# Example stack that builds Slidekick from source. Clone the repository to
# /opt/slidekick/src and put this file at /opt/slidekick/compose.yaml (adjust the
# paths to taste). Secrets live in /opt/slidekick/slidekick.env (mode 600, never
# in this file): SLIDEKICK_TOKEN, the all-powerful emergency server token, and
# optionally SLIDEKICK_SECRET_KEY. To run a published image instead, replace
# `build:` with `image: ghcr.io/secops-7/slidekick:latest`.
services:
  slidekick:
    build:
      context: /opt/slidekick/src
    image: slidekick:local
    container_name: slidekick
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "7410:7410"
    env_file:
      - /opt/slidekick/slidekick.env
    environment:
      SLIDEKICK_ADDR: ":7410"
      SLIDEKICK_DATA: /data
      SLIDEKICK_BASE_URL: ${SLIDEKICK_BASE_URL:-http://localhost:7410}
      # The LAN address of your TLS reverse proxy. Only it may set the
      # client address and https headers. Empty: no proxy trusted (plain LAN http).
      SLIDEKICK_TRUSTED_PROXIES: ${SLIDEKICK_TRUSTED_PROXIES:-}
    volumes:
      - /opt/slidekick/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m # Chromium profile and scratch space
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

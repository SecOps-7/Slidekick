# Slidekick stack. Install to /opt/slidekick/compose.yaml.
# Secrets live in /opt/slidekick/slidekick.env (mode 600): SLIDEKICK_TOKEN, the
# all-powerful emergency server token, and optionally SLIDEKICK_SECRET_KEY.
services:
  slidekick:
    build:
      context: /opt/slidekick/src
      target: render # includes Chromium for render_slide; drop for the slim image
    image: slidekick:local-render
    container_name: slidekick
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "7410:7410"
    env_file:
      - /opt/slidekick/slidekick.env
    environment:
      SLIDEKICK_ADDR: ":7410"
      SLIDEKICK_DATA: /data
      SLIDEKICK_BASE_URL: ${SLIDEKICK_BASE_URL:-http://localhost:7410}
      # The LAN address of the TLS proxy (Nginx Proxy Manager). Only it may set the
      # client address and https headers. Empty: no proxy trusted (plain LAN http).
      SLIDEKICK_TRUSTED_PROXIES: ${SLIDEKICK_TRUSTED_PROXIES:-}
    volumes:
      - /opt/slidekick/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m # Chromium profile and scratch space
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

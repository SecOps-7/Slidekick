# Slidekick stack. Install to /DATA/Stacks/slidekick/compose.yaml.
# Secrets (SLIDEKICK_TOKEN) live in /DATA/AppData/Slidekick/.env (mode 600).
services:
  slidekick:
    build:
      context: /DATA/Backup/Projects/Slidekick
    image: slidekick:local
    container_name: slidekick
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "7410:7410"
    env_file:
      - /DATA/AppData/Slidekick/.env
    environment:
      SLIDEKICK_ADDR: ":7410"
      SLIDEKICK_DATA: /data
      SLIDEKICK_BASE_URL: ${SLIDEKICK_BASE_URL:-http://localhost:7410}
    volumes:
      - /DATA/AppData/Slidekick/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build web app (typecheck, icons, bundles)
        run: |
          npm --prefix web ci --no-fund --no-audit
          npm --prefix web run build
      - name: Generated files are committed and current
        run: git diff --exit-code -- web/runtime/schema.gen.ts web/runtime/icons.gen.ts web/src/editor/validate.gen.js web/src/editor/validate.gen.d.ts
      - name: Web unit tests (animation presets, schema check)
        run: npm --prefix web test
      - name: Go vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Go tests
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build slim and render images (no push)
        run: |
          docker buildx build --load --target render -t slidekick:ci-render .
          docker buildx build -t slidekick:ci .
      - name: Golden screenshots (render image vs examples/golden)
        run: |
          docker run -d --name sk -p 127.0.0.1:7410:7410 --tmpfs /data:uid=65532 --tmpfs /tmp --shm-size 256m slidekick:ci-render serve
          for _ in $(seq 30); do curl -fs localhost:7410/healthz && break; sleep 1; done
          SLIDEKICK_GOLDEN_URL=http://127.0.0.1:7410 SLIDEKICK_GOLDEN_OUT=golden-out go test -count=1 -v ./internal/golden
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs
          path: golden-out/
          if-no-files-found: ignore
